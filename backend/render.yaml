services:
  - type: web
    name: cloudify-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        generateValue: true
    disk:
      name: cloudify-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
